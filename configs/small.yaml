# Configuration "small" : exécution complète en quelques minutes sur CPU.
name: small
seed: 42
horizon_days: 1080            # 36 mois simulés (mois = 30 jours)

banks: {A: 0.5, B: 0.3, C: 0.2}

population:
  identities: 20000
  multi_bank_share: 0.25      # clients légitimes présents dans 2 banques (même identité)
  onboarding_window_start: -3650   # flux continu d'ouvertures depuis 10 ans
  household_size_weights: [0.32, 0.30, 0.18, 0.13, 0.07]   # tailles 1..5
  dorm_buildings: 8           # résidences étudiantes : adresse + Wi-Fi partagés
  dorm_size: [15, 45]
  n_employers: 600
  employer_zipf_a: 1.3
  office_ip_share: 0.4
  cgnat_ips: 120              # IP mobiles partagées par des milliers d'abonnés
  public_wifi_ips: 30
  public_wifi_share: 0.25
  shared_tablet_share: 0.3
  elderly_assisted_share: 0.15
  distressed_share: 0.03      # défauts de crédit légitimes (ressemblent à un bust-out)
  newcomer_share: 0.08        # dossier de crédit très récent (primo-arrivants, « credit invisibles »)
  voip_share: 0.03
  new_email_share: 0.15
  new_phone_share: 0.15
  disposable_email_share: 0.005
  transactor_share: 0.45      # payent 100 % du relevé chaque mois
  tradeline_sellers_per_bank: 4
  mules_per_bank: 12
  n_merchants: 1500

fraud:
  rings: 110
  rings_per_operator: 3       # un opérateur réutilise une partie de ses ressources entre vagues
  ring_size: {median: 6, sigma: 0.45, min: 3, max: 30}
  sophistication_mix: {1: 0.3, 2: 0.4, 3: 0.3}
  subtle_scenarios: [shared_employer, tradeline, circular_transfers, complicit_merchant]
  holdout_scenarios: [complicit_merchant]   # mode opératoire jamais vu à l'entraînement
  cross_bank_share: 0.5
  spray_share: 0.35           # identité synthétique ouverte dans une 2e banque
  stolen_nid_share: {1: 0.10, 2: 0.20, 3: 0.30}
  ring_start_days: [-300, 700]
  onboarding_spread_days: 60
  cultivation_days: [180, 600]
  bust_out_days: [3, 21]
  label_delay_days: [60, 180]
  label_noise: 0.2            # bust-outs enregistrés comme "impayé" et non "fraude"

graph:
  projection_degree_cap: 30   # au-delà, l'attribut est un super-nœud (CGNAT, résidence…)
  merchant_degree_cap: 15     # seuls les petits marchands créent des liens de co-visite
  similarity_threshold: 85    # rapidfuzz, résolution d'entités intra-banque

evaluation:
  train_snapshots: [180, 300, 420, 540]
  label_cutoff: 720           # labels disponibles à cette date pour l'entraînement
  test_snapshots: [720, 810, 900]
  max_tenure_days: 730        # population surveillée : comptes ouverts depuis moins de 24 mois
  test_group_share: 0.5       # foyers légitimes réservés au test (disjonction)
  val_group_share: 0.25
  alert_budget_share: 0.02    # k = 2 % de la population scorée…
  target_prevalence: 0.01     # …ramenée à une prévalence réaliste de 1 % (négatifs repondérés)
  seeds: [0]

privacy:
  paillier_bits: 3072         # ≈ 128 bits de sécurité
  slot_bits: 16               # compteurs < 65 536 (OverflowError sinon) → 191 compteurs par chiffré
  decoy_ratio: 0.5            # 1 leurre pour 2 jetons réels dans les requêtes du hub
  encrypted_scoring_sample: 40

gnn:
  hidden: 64
  dropout: 0.3
  lr: 0.003
  weight_decay: 0.0001
  max_epochs: 120
  patience: 12                # en nombre de validations (une toutes les 2 époques)
  merchant_degree_cap: 200    # grandes enseignes exclues du graphe GNN (63 % des arêtes, aucune information)

go_no_go:
  min_pr_auc_gain_vs_best_baseline: 0.0
  min_ring_recall_before_bust_out: 0.5
  min_lead_time_days: 30
  max_he_security_bits_shortfall: 0
  max_encrypted_score_abs_error: 0.000001
