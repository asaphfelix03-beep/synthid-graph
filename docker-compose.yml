# Neo4j 5 (LTS) + APOC + Graph Data Science pour le PoC.
# Démarrage : docker compose up -d   —   Navigateur : http://localhost:7474
# Les ports ne sont exposés que sur 127.0.0.1 (poste de développement).
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: synthid-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-synthid-poc-local}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  neo4j-data:
